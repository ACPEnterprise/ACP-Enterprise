services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: acp_redis_qualification
      POSTGRES_USER: acp_redis_qualification
      POSTGRES_PASSWORD: redis-qualification-disposable-postgres-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp_redis_qualification -d acp_redis_qualification"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"
    networks:
      - qualification

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no", "--aclfile", "/run/secrets/users.acl", "--protected-mode", "yes"]
    tmpfs:
      - /data
    secrets:
      - source: redis_qualification_acl
        target: users.acl
      - source: redis_qualification_health_password
        target: health-password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/health-password) redis-cli --user acp-health ping | grep -qx PONG"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"
    networks:
      - qualification

  qualification:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://acp_redis_qualification:redis-qualification-disposable-postgres-only@postgres:5432/acp_redis_qualification
      REDIS_URL: redis://redis:6379/0
      REDIS_USERNAME: acp-application
      REDIS_PASSWORD_FILE: /run/secrets/application-password
      REDIS_REQUIRED_FOR_READINESS: "true"
      ACCESS_TOKEN_SIGNING_KEY: local-redis-qualification-signing-key
      SECURITY_TOKEN_HMAC_KEY: local-redis-qualification-hmac-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: redis_qualification_application_password
        target: application-password
    volumes:
      - ./backend:/app:ro
    command:
      - sh
      - -lc
      - >-
        alembic upgrade head &&
        pytest -q -p no:cacheprovider
        tests/platform/test_redis_runtime_integration.py
        tests/platform/test_health_readiness.py
        tests/platform/test_authentication_persistence.py
        tests/platform/test_authentication_services.py
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      - qualification

secrets:
  redis_qualification_acl:
    file: ${REDIS_QUALIFICATION_SECRET_DIR:?Set the disposable Redis qualification secret directory}/users.acl
  redis_qualification_application_password:
    file: ${REDIS_QUALIFICATION_SECRET_DIR:?Set the disposable Redis qualification secret directory}/application-password
  redis_qualification_health_password:
    file: ${REDIS_QUALIFICATION_SECRET_DIR:?Set the disposable Redis qualification secret directory}/health-password

networks:
  qualification:
    internal: true
