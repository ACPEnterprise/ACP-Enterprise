services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: acp_redis_qualification
      POSTGRES_USER: acp_redis_qualification
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp_redis_qualification -d acp_redis_qualification"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  qualification:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://acp_redis_qualification@postgres:5432/acp_redis_qualification
      REDIS_URL: redis://redis:6379/15
      REDIS_REQUIRED_FOR_READINESS: "true"
      ACCESS_TOKEN_SIGNING_KEY: local-redis-qualification-signing-key
      SECURITY_TOKEN_HMAC_KEY: local-redis-qualification-hmac-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app:ro
    command:
      - sh
      - -lc
      - >-
        alembic upgrade head &&
        pytest -q -p no:cacheprovider
        tests/platform/test_redis_runtime_integration.py
        tests/platform/test_health_readiness.py
        tests/platform/test_authentication_persistence.py
        tests/platform/test_authentication_services.py
        tests/platform/test_http_authentication_boundaries.py
