name: Immutable CI artifacts

on:
  pull_request:
  push:
    branches:
      - integration/**
      - handoff/**
      - work/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immutable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-and-build:
    name: Qualify and build commit-derived artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install locked Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Verify qualification runtimes
        shell: bash
        run: |
          qualification_python="$(command -v python)"
          case "$qualification_python" in
            /*) ;;
            *) echo "qualification Python did not resolve to an absolute path" >&2; exit 64 ;;
          esac
          test -x "$qualification_python"
          test "$(node --version)" = "v$(cat .node-version)"
          printf 'QUALIFICATION_PYTHON=%s\n' "$qualification_python" >> "$GITHUB_ENV"

      - name: Verify accepted Platform corrections
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          "$QUALIFICATION_PYTHON" scripts/verify-platform-corrections.py \
            --repository . \
            --candidate-sha "$CANDIDATE_SHA"

      - name: Install locked dependencies
        run: |
          "$QUALIFICATION_PYTHON" -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm ci --prefix frontend --ignore-scripts
          npm ci --prefix mobile --ignore-scripts

      - name: Static qualification
        run: |
          "$QUALIFICATION_PYTHON" scripts/release-secret-custody-check.py --env-example .env.preview.example
          "$QUALIFICATION_PYTHON" -m ruff check backend
          "$QUALIFICATION_PYTHON" -m ruff format --check backend
          "$QUALIFICATION_PYTHON" -m mypy backend/app backend/scripts backend/development_factory
          npm run lint --prefix frontend
          npm run lint --prefix mobile
          npm run typecheck --prefix mobile

      - name: Backend qualification
        run: scripts/qualify-backend-tests --python "$QUALIFICATION_PYTHON" -ra backend/tests

      - name: Frontend and mobile qualification
        run: |
          npm run test:run --prefix frontend
          npm run build --prefix frontend
          npm test --prefix mobile -- --runInBand
          npm run config:validate --prefix mobile

      - name: Build and independently verify immutable artifacts
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/twelvehats-artifacts
        run: |
          mkdir -m 700 "$ARTIFACT_DIRECTORY"
          scripts/ci-artifacts build \
            --candidate-sha "$CANDIDATE_SHA" \
            --output-directory "$ARTIFACT_DIRECTORY"
          scripts/ci-artifacts verify \
            --candidate-sha "$CANDIDATE_SHA" \
            --manifest "$ARTIFACT_DIRECTORY/ci-artifact-manifest.json"

      - name: Publish immutable candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twelvehats-${{ github.sha }}
          path: |
            ${{ runner.temp }}/twelvehats-artifacts/application.tar.gz
            ${{ runner.temp }}/twelvehats-artifacts/tooling.tar.gz
            ${{ runner.temp }}/twelvehats-artifacts/ci-artifact-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
