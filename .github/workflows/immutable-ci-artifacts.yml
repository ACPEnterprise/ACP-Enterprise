name: Immutable CI artifacts

on:
  pull_request:
  push:
    branches:
      - integration/**
      - handoff/**
      - work/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immutable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-and-build:
    name: Qualify and build commit-derived artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          npm ci --prefix frontend --ignore-scripts
          npm ci --prefix mobile --ignore-scripts

      - name: Static qualification
        run: |
          python scripts/release-secret-custody-check.py --env-example .env.preview.example
          python -m ruff check backend
          python -m ruff format --check backend
          python -m mypy backend/app backend/scripts backend/development_factory
          npm run lint --prefix frontend
          npm run lint --prefix mobile
          npm run typecheck --prefix mobile

      - name: Backend qualification
        run: scripts/qualify-backend-tests --python "$(command -v python)" -ra backend/tests

      - name: Frontend and mobile qualification
        run: |
          npm run test:run --prefix frontend
          npm run build --prefix frontend
          npm test --prefix mobile -- --runInBand
          npm run config:validate --prefix mobile

      - name: Build and independently verify immutable artifacts
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/twelvehats-artifacts
        run: |
          mkdir -m 700 "$ARTIFACT_DIRECTORY"
          scripts/ci-artifacts build \
            --candidate-sha "$CANDIDATE_SHA" \
            --output-directory "$ARTIFACT_DIRECTORY"
          scripts/ci-artifacts verify \
            --candidate-sha "$CANDIDATE_SHA" \
            --manifest "$ARTIFACT_DIRECTORY/ci-artifact-manifest.json"

      - name: Publish immutable candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twelvehats-${{ github.sha }}
          path: |
            ${{ runner.temp }}/twelvehats-artifacts/application.tar.gz
            ${{ runner.temp }}/twelvehats-artifacts/tooling.tar.gz
            ${{ runner.temp }}/twelvehats-artifacts/ci-artifact-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
