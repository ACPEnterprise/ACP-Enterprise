x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-ACP Enterprise}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  ENVIRONMENT: preview
  BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/New_York}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.preview}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["https://preview.allcountyhomeservices.com"]}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["preview.allcountyhomeservices.com","backend","localhost","127.0.0.1"]}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ACCESS_TOKEN_KEYS: ${ACCESS_TOKEN_KEYS:?Set ACCESS_TOKEN_KEYS in .env.preview}
  ACCESS_TOKEN_ACTIVE_KID: ${ACCESS_TOKEN_ACTIVE_KID:-preview-2026-01}
  ACCESS_TOKEN_ALGORITHM: ${ACCESS_TOKEN_ALGORITHM:-HS256}
  ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER:-acp-enterprise-preview}
  ACCESS_TOKEN_AUDIENCE: ${ACCESS_TOKEN_AUDIENCE:-acp-enterprise-preview-api}
  SECURITY_TOKEN_HMAC_KEY: ${SECURITY_TOKEN_HMAC_KEY:?Set SECURITY_TOKEN_HMAC_KEY in .env.preview}
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: "true"
  TRUST_FORWARDED_HEADERS: "true"
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["172.30.0.0/24"]}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acp_enterprise_preview}
      POSTGRES_USER: ${POSTGRES_USER:-acp_enterprise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.preview}
    volumes:
      - preview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      preview:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - preview_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      preview:

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.preview
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      preview:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.preview
    environment: *backend-environment
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status']=='healthy'"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped
    networks:
      preview:

  worker:
    profiles: ["worker"]
    build:
      context: ./backend
      dockerfile: Dockerfile.preview
    environment:
      ACP_WORKER_BASE_URL: http://backend:8000
      ACP_WORKER_ID: ${ACP_WORKER_ID:-00000000-0000-0000-0000-000000000000}
      ACP_WORKER_PRIVATE_KEY_FILE: /run/secrets/preview-worker.key
      ACP_WORKER_CAPABILITIES: ${ACP_WORKER_CAPABILITIES:-transport.connectivity}
      ACP_WORKER_WORKSPACE_ROOT: ${ACP_WORKER_WORKSPACE_ROOT_CONTAINER:-/workspace}
      ACP_WORKER_HEARTBEAT_SECONDS: "30"
      ACP_WORKER_REQUEST_TIMEOUT_SECONDS: "10"
      ACP_WORKER_STATE_DIRECTORY: /var/lib/acp-worker
      ACP_WORKER_SERVICE_VERSION: ${ACP_WORKER_SERVICE_VERSION:-unknown}
      ACP_WORKER_RECONNECT_MIN_SECONDS: "2"
      ACP_WORKER_RECONNECT_MAX_SECONDS: "30"
    command: ["python", "-m", "app.worker_runtime"]
    volumes:
      - ${ACP_WORKER_PRIVATE_KEY_FILE_HOST:-/opt/acp-enterprise/shared/secrets/preview-worker.key}:/run/secrets/preview-worker.key:ro
      - ${ACP_WORKER_WORKSPACE_ROOT_HOST:-/opt/acp-enterprise/shared/worker-workspaces}:${ACP_WORKER_WORKSPACE_ROOT_CONTAINER:-/workspace}:ro
      - preview_worker_state:/var/lib/acp-worker
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time,pathlib; p=pathlib.Path('/var/lib/acp-worker/health.json'); d=json.loads(p.read_text()); assert time.time()-p.stat().st_mtime < 90; assert d['worker_id']"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      preview:

  worker-provision:
    profiles: ["worker-provision"]
    build:
      context: ./backend
      dockerfile: Dockerfile.preview
    environment:
      <<: *backend-environment
      ACP_WORKER_COMPANY_CODE: ${ACP_WORKER_COMPANY_CODE:?Set ACP_WORKER_COMPANY_CODE}
      ACP_WORKER_ADMINISTRATOR_EMAIL: ${ACP_WORKER_ADMINISTRATOR_EMAIL:?Set ACP_WORKER_ADMINISTRATOR_EMAIL}
      ACP_WORKER_NAME: ${ACP_WORKER_NAME:-ACP Preview Engineering Worker}
      ACP_WORKER_PROVIDER_IDENTIFIER: ${ACP_WORKER_PROVIDER_IDENTIFIER:-connectivity}
      ACP_WORKER_CAPABILITIES: ${ACP_WORKER_CAPABILITIES:-transport.connectivity}
      ACP_WORKER_PRIVATE_KEY_FILE: /run/secrets/preview-worker.key
      ACP_WORKER_CREDENTIAL_DAYS: ${ACP_WORKER_CREDENTIAL_DAYS:-30}
    command: ["python", "-m", "app.worker_runtime.provision"]
    volumes:
      - ${ACP_WORKER_PRIVATE_KEY_FILE_HOST:-/opt/acp-enterprise/shared/secrets/preview-worker.key}:/run/secrets/preview-worker.key
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      preview:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /
    ports:
      - "127.0.0.1:${PREVIEW_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    networks:
      preview:

volumes:
  preview_postgres_data:
  preview_redis_data:
  preview_worker_state:

networks:
  preview:
    ipam:
      config:
        - subnet: 172.30.0.0/24
