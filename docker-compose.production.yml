x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-ACP Enterprise}
  APP_VERSION: ${APP_VERSION:?Set the immutable protected SHA}
  ENVIRONMENT: production
  BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/New_York}
  DATABASE_URL: ${DATABASE_URL:?Set the isolated Production PostgreSQL URL}
  REDIS_URL: ${REDIS_URL:?Set the isolated Production Redis URL}
  REDIS_USERNAME: ${REDIS_USERNAME:?Set the Production Redis user}
  REDIS_PASSWORD_FILE: /run/secrets/redis/application-password
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the exact Production HTTPS origin}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set exact Production hosts}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PLATFORM_CONTRACT_EXPECTED_FINGERPRINT: ${PLATFORM_CONTRACT_EXPECTED_FINGERPRINT:?Set the approved contract fingerprint}
  ACCESS_TOKEN_KEYS: ${ACCESS_TOKEN_KEYS:?Inject the Production signing keyring}
  ACCESS_TOKEN_ACTIVE_KID: ${ACCESS_TOKEN_ACTIVE_KID:?Set the active Production signing key}
  ACCESS_TOKEN_ALGORITHM: ${ACCESS_TOKEN_ALGORITHM:-HS256}
  ACCESS_TOKEN_ISSUER: ${ACCESS_TOKEN_ISSUER:-twelve-hats-production}
  ACCESS_TOKEN_AUDIENCE: ${ACCESS_TOKEN_AUDIENCE:-twelve-hats-production-api}
  SECURITY_TOKEN_HMAC_KEY: ${SECURITY_TOKEN_HMAC_KEY:?Inject the Production security HMAC key}
  IDENTITY_ONBOARDING_DELIVERY_KEY_FILE: /run/secrets/twelve-hats/identity-onboarding-delivery-keyring.json
  IDENTITY_ONBOARDING_ACTIVE_DELIVERY_KID: ${IDENTITY_ONBOARDING_ACTIVE_DELIVERY_KID:?Set the Production delivery key ID}
  IDENTITY_ONBOARDING_DELIVERY_PROVIDER: ${IDENTITY_ONBOARDING_DELIVERY_PROVIDER:-owner-mediated-production}
  IDENTITY_EMAIL_ACTIVATION_ORIGIN: https://${PRODUCTION_HOSTNAME:?Set the owner-approved Production hostname}
  PAYROLL_INPUT_ENCRYPTION_KEY_FILE: /run/secrets/twelve-hats/payroll-input-encryption-keyring.json
  PAYROLL_INPUT_ACTIVE_KID: ${PAYROLL_INPUT_ACTIVE_KID:?Set the Production protected-input key ID}
  COMMUNICATIONS_DELIVERY_ENABLED: "false"
  COMMUNICATIONS_WEBHOOK_ENABLED: "false"
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: "true"
  HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-31536000}
  HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-true}
  HSTS_PRELOAD: ${HSTS_PRELOAD:-false}
  TRUST_FORWARDED_HEADERS: "true"
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["172.31.0.0/24"]}
  QBO_SANDBOX_ENABLED: "false"
  QBO_PRODUCTION_ENABLED: "false"
  QBO_PRODUCTION_EVIDENCE_ROOT: /var/lib/twelve-hats-evidence/qbo-production-readonly
  HCP_SOURCE4_EVIDENCE_ROOT: /var/lib/twelve-hats-evidence/hcp/source4

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-runtime: &backend-runtime
  image: ${ACP_BACKEND_IMAGE:?Set an immutable backend image digest}
  init: true
  stop_grace_period: 30s
  cpus: ${BACKEND_CPUS:-2.0}
  mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
  pids_limit: ${BACKEND_PIDS_LIMIT:-256}
  environment: *backend-environment
  volumes:
    - ${PRODUCTION_PROTECTED_SECRET_DIR_HOST:?Set the Production secret directory}:/run/secrets/twelve-hats:ro
    - ${PRODUCTION_REDIS_SECRET_DIR_HOST:?Set the Production Redis secret directory}:/run/secrets/redis:ro
    - ${PRODUCTION_EVIDENCE_DIR_HOST:?Set the Production evidence directory}:/var/lib/twelve-hats-evidence:ro
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  networks:
    - production

services:
  migrate:
    <<: *backend-runtime
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *backend-runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${BACKEND_WORKERS:-2}", "--no-access-log"]
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)); assert data['state']=='HEALTHY'"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    restart: unless-stopped

  identity-delivery-worker:
    <<: *backend-runtime
    profiles: ["identity-delivery"]
    environment:
      <<: *backend-environment
      IDENTITY_OUTBOX_WORKER_ENABLED: "true"
    command: ["python", "-m", "app.communications.identity_worker"]
    restart: unless-stopped

  frontend:
    image: ${ACP_FRONTEND_IMAGE:?Set an immutable frontend image digest}
    user: "101:101"
    init: true
    stop_grace_period: 15s
    cpus: ${FRONTEND_CPUS:-1.0}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=4m,mode=0755,uid=101,gid=101
    ports:
      - "127.0.0.1:${PRODUCTION_HTTP_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - production

networks:
  production:
    ipam:
      config:
        - subnet: 172.31.0.0/24
