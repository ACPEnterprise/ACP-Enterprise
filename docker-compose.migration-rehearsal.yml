services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: acp_hcp_rehearsal_import
      POSTGRES_USER: acp_hcp_rehearsal
      POSTGRES_PASSWORD: ${HCP_REHEARSAL_POSTGRES_PASSWORD:?Set a dedicated rehearsal password}
    volumes:
      - hcp_rehearsal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp_hcp_rehearsal -d acp_hcp_rehearsal_import"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels:
      acp.environment: migration_rehearsal
      acp.production_access: "false"
      acp.preview_access: "false"
    restart: "no"
    networks:
      migration_rehearsal:

  exporter:
    profiles: ["export"]
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      ENVIRONMENT: migration_rehearsal
      PYTHONPATH: /workspace/backend
      DATABASE_URL: postgresql+asyncpg://acp_hcp_rehearsal:${HCP_REHEARSAL_POSTGRES_PASSWORD:?Set a dedicated rehearsal password}@postgres:5432/acp_hcp_rehearsal_import
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/workspace/backend:ro
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks:
      migration_rehearsal:

volumes:
  hcp_rehearsal_postgres_data:

networks:
  migration_rehearsal:
    internal: true
