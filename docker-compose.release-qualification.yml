x-qualification-environment: &qualification-environment
  ENVIRONMENT: test
  REDIS_URL: redis://redis:6379/0
  REDIS_USERNAME: acp-application
  REDIS_PASSWORD_FILE: /run/secrets/application-password
  REDIS_REQUIRED_FOR_READINESS: "true"
  ACCESS_TOKEN_KEYS: '{"release-qualification":"release-qualification-disposable-signing-key-32-bytes"}'
  ACCESS_TOKEN_ACTIVE_KID: release-qualification
  INVITATION_TOKEN_HMAC_KEY: release-qualification-disposable-hmac-key-32-bytes
  SECURITY_TOKEN_HMAC_KEY: release-qualification-disposable-security-hmac-key

x-application-runtime: &application-runtime
  build:
    context: ./backend
  secrets:
    - source: release_qualification_application_password
      target: application-password
    - source: release_qualification_postgres_password
      target: postgres-password
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: "no"
  networks:
    - qualification

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: release_qualification
      POSTGRES_USER: release_qualification
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    secrets:
      - source: release_qualification_postgres_password
        target: postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_qualification -d release_qualification"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    networks:
      - qualification
    volumes:
      - qualification-postgres:/var/lib/postgresql/data

  restore-postgres:
    profiles: ["restore"]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: acp_resilience_restore_qualification
      POSTGRES_USER: release_qualification
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    secrets:
      - source: release_qualification_postgres_password
        target: postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_qualification -d acp_resilience_restore_qualification"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    networks:
      - qualification
    volumes:
      - qualification-restore-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no", "--aclfile", "/run/secrets/users.acl", "--protected-mode", "yes"]
    tmpfs:
      - /data
    secrets:
      - source: release_qualification_acl
        target: users.acl
      - source: release_qualification_health_password
        target: health-password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/health-password) redis-cli --user acp-health ping | grep -qx PONG"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: "no"
    networks:
      - qualification

  qualifier:
    <<: *application-runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *qualification-environment
      DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
    command:
      - /bin/sh
      - -ec
      - |
        database_password="$$(cat "$$DATABASE_PASSWORD_FILE")"
        export DATABASE_URL="postgresql+asyncpg://release_qualification:$${database_password}@postgres:5432/release_qualification"
        exec python -m scripts.qualify_release_database

  readiness:
    <<: *application-runtime
    profiles: ["restore"]
    depends_on:
      restore-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *qualification-environment
      DATABASE_PASSWORD_FILE: /run/secrets/postgres-password
    command:
      - /bin/sh
      - -ec
      - |
        database_password="$$(cat "$$DATABASE_PASSWORD_FILE")"
        export DATABASE_URL="postgresql+asyncpg://release_qualification:$${database_password}@restore-postgres:5432/acp_resilience_restore_qualification"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --no-access-log
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)); assert data['state']=='HEALTHY'"]
      interval: 2s
      timeout: 5s
      start_period: 5s
      retries: 30

secrets:
  release_qualification_acl:
    file: ${RELEASE_QUALIFICATION_SECRET_DIR:?Set the disposable release qualification secret directory}/users.acl
  release_qualification_application_password:
    file: ${RELEASE_QUALIFICATION_SECRET_DIR:?Set the disposable release qualification secret directory}/application-password
  release_qualification_health_password:
    file: ${RELEASE_QUALIFICATION_SECRET_DIR:?Set the disposable release qualification secret directory}/health-password
  release_qualification_postgres_password:
    file: ${RELEASE_QUALIFICATION_SECRET_DIR:?Set the disposable release qualification secret directory}/postgres-password

volumes:
  qualification-postgres:
  qualification-restore-postgres:

networks:
  qualification:
    internal: true
