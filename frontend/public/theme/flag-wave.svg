  <!-- Long folds add low-contrast fabric depth across the whole flag. -->
  <rect width="1600" height="900" fill="url(#fabric)" opacity=".56"/>
  <path d="M-80 0C220 250 150 570 420 900M360 0c230 260 160 570 430 900M900 0c-180 250-100 560-360 900M1360 0c-190 260-110 580-360 900" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".12" stroke-width="70"/>
