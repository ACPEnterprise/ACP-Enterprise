log_format acp_safe escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Query strings and referrers can contain search text, return context, or
    # one-time identity material. Retain operational path/status/timing evidence
    # without persisting those values or duplicating backend access telemetry.
    access_log /var/log/nginx/access.log acp_safe;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # FastAPI applies the same browser security headers to API responses. Hide
    # upstream copies before applying this edge policy once, avoiding duplicate
    # HSTS/CSP/Permissions headers through the frontend proxy.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /backend-health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Activation and password-recovery links carry a single-use token in the
    # query string. The public edge also suppresses these requests and sets a
    # no-referrer policy; this defense-in-depth boundary keeps the raw request
    # out of the container access log.
    location = /activate {
        access_log off;
        try_files /index.html =404;
    }

    location = /reset-password {
        access_log off;
        try_files /index.html =404;
    }

    # OAuth codes and state arrive in the public query string. Suppress this
    # request from access logs and forward values as internal headers while
    # removing the query string before the request reaches Uvicorn.
    location = /api/v1/integrations/qbo/oauth/callback {
        access_log off;
        set $qbo_code $arg_code;
        set $qbo_state $arg_state;
        set $qbo_realm $arg_realmId;
        set $qbo_error $arg_error;
        rewrite ^ /api/v1/integrations/qbo/oauth/callback? break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-ACP-QBO-Code $qbo_code;
        proxy_set_header X-ACP-QBO-State $qbo_state;
        proxy_set_header X-ACP-QBO-Realm $qbo_realm;
        proxy_set_header X-ACP-QBO-Error $qbo_error;
    }

    location = /api/v1/integrations/qbo/production/oauth/callback {
        access_log off;
        set $qbo_code $arg_code;
        set $qbo_state $arg_state;
        set $qbo_realm $arg_realmId;
        set $qbo_error $arg_error;
        rewrite ^ /api/v1/integrations/qbo/production/oauth/callback? break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-ACP-QBO-Code $qbo_code;
        proxy_set_header X-ACP-QBO-State $qbo_state;
        proxy_set_header X-ACP-QBO-Realm $qbo_realm;
        proxy_set_header X-ACP-QBO-Error $qbo_error;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # `/assets` is an owner-facing application route as well as Vite's static
    # artifact directory. Exact route requests must enter the SPA instead of
    # Nginx's directory redirect/403 behavior. Hashed files below `/assets/`
    # continue through the ordinary existing-file branch.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
